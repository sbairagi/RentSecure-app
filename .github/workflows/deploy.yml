# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 6: Deploy to Production
# ═══════════════════════════════════════════════════════════════════════════════
# Runs: EAS Build production build
# NOTE: Disabled temporarily — restore `push` trigger before actual deployment
# ═══════════════════════════════════════════════════════════════════════════════
name: Deploy Mobile

"on":
  workflow_call:
    secrets:
      EAS_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Stage 6 │ EAS Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-node
        with:
          node-version: "20"
          cache-key-suffix: "-deploy"
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Build with EAS
        run: eas build --platform all --profile production --non-interactive
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
