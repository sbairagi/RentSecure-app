# ═══════════════════════════════════════════════════════════════════════════════
# STAGE 7: Security Deep (Nightly / Main Branch)
# ═══════════════════════════════════════════════════════════════════════════════
# Runs: CodeQL Advanced Analysis (JavaScript/TypeScript), OpenSSF Scorecard,
#       Dependency Review, Trivy Deep Scan
# Triggers: nightly schedule + workflow_dispatch
# Does not run on every push or PR (kept lightweight via security.yml).
# ═══════════════════════════════════════════════════════════════════════════════
name: Security Deep

"on":
  workflow_call:
  workflow_dispatch:

concurrency:
  group: security-deep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write

jobs:
  codeql:
    name: Stage 7a │ CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript,typescript
          queries: security-extended,security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          upload: true

  scorecard:
    name: Stage 7b │ OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF to GitHub Security
        if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: scorecard-results.sarif

  dependency-review:
    name: Stage 7c │ Dependency Review (Nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify Dependency Graph is available
        id: dep-graph-check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GH_TOKEN}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/dependency-graph/snapshots")
          echo "dependency_graph_status=${status}" >> $GITHUB_OUTPUT
          if [ "${status}" == "404" ]; then
            echo "Dependency Graph is not available for this repository. Skipping Dependency Review."
            exit 0
          elif [ "${status}" != "200" ]; then
            echo "::warning::Unexpected status ${status} from dependency-graph API. Attempting Dependency Review anyway."
          fi
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: ${{ steps.dep-graph-check.outputs.dependency_graph_status != '404' }}
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC

  trivy-deep:
    name: Stage 7d │ Trivy Deep Scan (Nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Trivy deep filesystem scan
        id: trivy-deep
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: "sarif"
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          skip-dirs: node_modules,.expo,dist,build
          vuln-type: "os,library"
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
      - name: Verify Trivy SARIF output exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f trivy-results.sarif ]; then
            echo "::error::Trivy deep scan did not produce trivy-results.sarif"
            echo "::error::Scan step id=trivy-deep outcome=${{ steps.trivy-deep.outcome }} conclusion=${{ steps.trivy-deep.conclusion }}"
            exit 1
          fi
      - name: Upload Trivy SARIF to GitHub Security
        if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
